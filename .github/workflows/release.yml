name: Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar_ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.toml') }}

      - name: Install backend deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller==6.11.*

      - name: Bake cloud preview key into .env
        shell: bash
        env:
          GOOGLE_API_KEY_PREVIEW: ${{ secrets.GOOGLE_API_KEY_PREVIEW }}
        run: |
          if [ -n "$GOOGLE_API_KEY_PREVIEW" ]; then
            echo "GOOGLE_API_KEY=${GOOGLE_API_KEY_PREVIEW}" >> .env
            echo "CLOUD_MODEL=gemini-3-flash" >> .env
            echo "✓ Cloud preview key baked into .env (CLOUD_MODE left unset — defaults to local)"
          else
            echo "⚠ GOOGLE_API_KEY_PREVIEW not set — building without cloud preview key"
          fi

      - name: Build backend sidecar
        run: pyinstaller backend/pyinstaller.spec --clean --noconfirm

      - name: Stage sidecar for Tauri
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          src="dist/event-med-backend${{ matrix.sidecar_ext }}"
          dst="frontend/src-tauri/binaries/event-med-backend-${{ matrix.target }}${{ matrix.sidecar_ext }}"
          cp "$src" "$dst"
          chmod +x "$dst" || true

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Tauri app
        working-directory: frontend
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Stage portable Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          stage="portable/staging/Event-Med-AI_${version}_x64_portable"
          mkdir -p "$stage"
          cp "frontend/src-tauri/target/${{ matrix.target }}/release/event-med-ai.exe" \
             "$stage/Event Med AI.exe"
          cp "frontend/src-tauri/binaries/event-med-backend-${{ matrix.target }}.exe" \
             "$stage/event-med-backend.exe"
          cp README.md "$stage/README.md" 2>/dev/null || true
          (cd "portable/staging" && \
            7z a -tzip "../Event-Med-AI_${version}_x64_portable.zip" \
              "Event-Med-AI_${version}_x64_portable")

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: event-med-ai-${{ matrix.target }}
          path: |
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            frontend/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            portable/*.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
